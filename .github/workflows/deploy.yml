name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let an in-flight deploy finish rather than cancelling it mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      # Still built on every push so a broken app cannot slip in unnoticed
      # while the site is down, even though the output is not what ships.
      - run: npm ci
      - run: npm run build

      - uses: actions/configure-pages@v6

      # TEMPORARY: publishing the holding page instead of the real site while
      # the placeholder content is rewritten. To put the site back, change the
      # path below from `holding` to `dist`. Nothing else needs to move.
      - uses: actions/upload-pages-artifact@v5
        with:
          path: holding

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
